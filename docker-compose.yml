services:
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    image: nokia-provisioner-backend:local
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost}
      DATABASE_PATH: /data/db.sqlite3
    volumes:
      - db_data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/stats/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    image: nokia-provisioner-frontend:local
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # SSH tunnel relay: station PCs at remote sites reverse-forward their
  # locally attached Nokia routers here. Backend reaches them as
  # https://relay:<port> (see deploy/relay/stations.tsv for assignments).
  relay:
    build:
      context: .
      dockerfile: deploy/relay.Dockerfile
    image: nokia-provisioner-relay:local
    ports:
      - "2222:2222"
    volumes:
      - ./deploy/relay/authorized_keys:/etc/relay/authorized_keys:ro
    restart: unless-stopped

volumes:
  db_data:
